name: refresh examples

# The x-mesh card reports a measured number, so it has to be re-measured
# rather than remembered. --all covers both variants, so the dark examples
# cannot drift away from the light ones.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node bin/card.mjs render --config examples/x-mesh.json --all --out-dir examples/out
      - run: |
          if git diff --quiet -- examples/out; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/out
          git commit -m "chore: refresh example cards"
          git push

