<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="686" viewBox="0 0 1400 686" role="img" aria-label="x-mesh — layers — editorial">
  <rect x="0" y="0" width="1400" height="690" fill="#14120f"/>
  <text x="72" y="66" fill="#eae6dd" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="15" font-weight="700" letter-spacing="3.4" xml:space="preserve">THE LAYERS</text>
  <text x="1190.62" y="66" fill="#a29a89" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="13.5" xml:space="preserve">5, kept separate</text>
  <line x1="72" y1="80" x2="1328" y2="80" stroke="#eae6dd" stroke-width="1.5"/>
  <text x="72" y="130" fill="#6b6557" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" xml:space="preserve">01</text>
  <text x="156" y="134" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="31" letter-spacing="-0.5" xml:space="preserve">environment</text>
  <text x="156" y="164" fill="#a29a89" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="16" xml:space="preserve">term-mesh</text>
  <text x="486" y="128" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" xml:space="preserve">Where agents run.</text>
  <text x="486" y="160" fill="#a29a89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="16.5" xml:space="preserve">A team of them in parallel, each in its own sandboxed worktree, local or over SSH.</text>
  <line x1="72" y1="212" x2="1328" y2="212" stroke="#2d2822" stroke-width="1"/>
  <text x="72" y="234" fill="#6b6557" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" xml:space="preserve">02</text>
  <text x="156" y="238" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="31" letter-spacing="-0.5" xml:space="preserve">harness</text>
  <text x="156" y="268" fill="#a29a89" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="16" xml:space="preserve">xm</text>
  <text x="486" y="232" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" xml:space="preserve">What gets built, and whether it ships.</text>
  <text x="486" y="264" fill="#a29a89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="16.5" xml:space="preserve">Repository-grounded plans, the smallest sufficient change, a cross-vendor panel that gates the result.</text>
  <line x1="72" y1="316" x2="1328" y2="316" stroke="#2d2822" stroke-width="1"/>
  <text x="72" y="338" fill="#6b6557" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" xml:space="preserve">03</text>
  <text x="156" y="342" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="31" letter-spacing="-0.5" xml:space="preserve">context</text>
  <text x="156" y="372" fill="#a29a89" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="16" xml:space="preserve">mem-mesh</text>
  <rect x="247.41" y="360" width="53.98" height="17" rx="3" fill="none" stroke="#1a7f37" stroke-width="1"/>
  <text x="253.41" y="372" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="11" letter-spacing="1.3" xml:space="preserve">OPT-IN</text>
  <text x="486" y="336" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" xml:space="preserve">What survives the session.</text>
  <text x="486" y="368" fill="#a29a89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="16.5" xml:space="preserve">It attaches at the agent, not at the app, so any environment above picks it up. Nothing here requires it.</text>
  <line x1="72" y1="420" x2="1328" y2="420" stroke="#2d2822" stroke-width="1"/>
  <text x="72" y="442" fill="#6b6557" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" xml:space="preserve">04</text>
  <text x="156" y="446" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="31" letter-spacing="-0.5" xml:space="preserve">version control</text>
  <text x="156" y="476" fill="#a29a89" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="16" xml:space="preserve">gk</text>
  <text x="486" y="440" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" xml:space="preserve">Staying recoverable.</text>
  <text x="486" y="472" fill="#a29a89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="16.5" xml:space="preserve">Reflog-backed undo, time-machine restore, policies as code.</text>
  <line x1="72" y1="524" x2="1328" y2="524" stroke="#2d2822" stroke-width="1"/>
  <text x="72" y="546" fill="#6b6557" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="14" xml:space="preserve">05</text>
  <text x="156" y="550" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="31" letter-spacing="-0.5" xml:space="preserve">operations</text>
  <text x="156" y="580" fill="#a29a89" font-family="ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace" font-size="16" xml:space="preserve">aic · edc · httprove · dbops</text>
  <text x="486" y="544" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" xml:space="preserve">What broke after it shipped.</text>
  <text x="486" y="576" fill="#a29a89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="16.5" xml:space="preserve">Diagnosis is read-only and stops at the fault. Anything that writes makes you type the target's name first.</text>
  <line x1="72" y1="628" x2="1328" y2="628" stroke="#2d2822" stroke-width="1"/>
  <text x="72" y="662" fill="#eae6dd" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="19" xml:space="preserve">each layer stands alone.</text>
  <text x="298.3" y="662" fill="#a29a89" font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif" font-size="19" xml:space="preserve">take one, or wire them together.</text>
</svg>
